<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MALAC — Online Shopping in Pakistan | M.A Luxury Apparel Collection</title>
    <meta name="description" content="Online shopping in Pakistan at MALAC — mobiles, electronics, fashion, beauty, home & living and more, with Cash on Delivery and free shipping on orders over Rs. 5,000." />
    <link rel="canonical" href="https://malac1.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="mLs67jy_2w9Ap0httaWaCtfWJJdAbzMeyeNrcZsXf4Q" />
    <meta name="theme-color" content="#0f172a" />
    <!-- PWA: installable web app (manifest + /sw.js registered in main.jsx) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MALAC" />
    <meta name="geo.region" content="PK" />
    <meta name="geo.placename" content="Pakistan" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MALAC" />
    <meta property="og:title" content="MALAC — Online Shopping in Pakistan | M.A Luxury Apparel Collection" />
    <meta property="og:description" content="Online shopping in Pakistan at MALAC — mobiles, electronics, fashion, beauty, home & living and more, with Cash on Delivery and free shipping on orders over Rs. 5,000." />
    <meta property="og:url" content="https://malac1.vercel.app/" />
    <!-- Branded share image (1200x630): the official MALAC logo artwork on
         the site's cream background, served by the API at /og-image.png
         (base64-embedded in server/src/assets/ogImageAssets.js). -->
    <meta property="og:image" content="https://malac1.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://malac1.vercel.app/og-image.png" />
    <meta name="twitter:title" content="MALAC — Online Shopping in Pakistan | M.A Luxury Apparel Collection" />
    <meta name="twitter:description" content="Online shopping in Pakistan at MALAC — mobiles, electronics, fashion, beauty, home & living and more, with Cash on Delivery and free shipping on orders over Rs. 5,000." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "OnlineStore"],
          "name": "MALAC",
          "url": "https://malac1.vercel.app/",
          "email": "developersbiuro@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "PK"
          },
          "areaServed": [
            { "@type": "Country", "name": "Pakistan" },
            { "@type": "City", "name": "Karachi" },
            { "@type": "City", "name": "Lahore" },
            { "@type": "City", "name": "Islamabad" },
            { "@type": "City", "name": "Peshawar" },
            { "@type": "City", "name": "Faisalabad" }
          ],
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "MALAC",
          "url": "https://malac1.vercel.app/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://malac1.vercel.app/shop?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Product/hero imagery is served from picsum.photos; warm the
         connection and preload the homepage hero (first carousel slide,
         a fixed URL in HeroCarousel.jsx) as the likely LCP element. -->
    <link rel="preconnect" href="https://picsum.photos" />
    <link rel="preload" as="image" fetchpriority="high" href="https://picsum.photos/seed/malac-hero1/1400/420" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
